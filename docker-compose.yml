version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passivedata-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/passivedata.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    networks:
      - passivedata-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: passivedata-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - passivedata-network

networks:
  passivedata-network:
    driver: bridge

volumes:
  data:
